<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const {
  ResponsiveContainer, AreaChart, Area, LineChart, Line, BarChart, Bar,
  XAxis, YAxis, CartesianGrid, Tooltip, Cell, ReferenceLine, PieChart, Pie,
} = Recharts;

/* ============================================================================
   MOCK DATA  —  edit anything here live during the demo.
   All figures are fictional but internally consistent: every KPI, crew
   scorecard and chart below is COMPUTED from these raw rows so the numbers
   always add up.  AUD ($), Australian English throughout.
   ========================================================================== */

const COST_MODEL = {
  vehiclePerMin: 0.55,   // fuel + vehicle wear, per travel minute
  overheadRate: 0.10,    // business overhead loading as % of job revenue
};

// Per-crew labour. Combined wage/min = (payRate ÷ 60) × crewSize.
const CREWS = {
  A: { name: 'Crew A', lead: 'J.M.', payRate: 40, crewSize: 2, colour: '#38BDF8' },
  B: { name: 'Crew B', lead: 'T.R.', payRate: 38, crewSize: 2, colour: '#22D3EE' },
  C: { name: 'Crew C', lead: 'D.K.', payRate: 44, crewSize: 3, colour: '#818CF8' },
  D: { name: 'Crew D', lead: 'S.P.', payRate: 41, crewSize: 2, colour: '#34D399' },
};

// Today's completed jobs.  scheduledRevenue = SortScape estimate · actualRevenue = Xero invoice
const JOBS = [
  { id:'J-1041', crew:'A', client:'Brighton Beach House',     suburb:'Brighton',     service:'Weekly Mow',          scheduledMins:30,  actualMins:32,  travelMins:16, scheduledRevenue:85,  actualRevenue:85  },
  { id:'J-1042', crew:'A', client:'Hampton St Residence',     suburb:'Hampton',      service:'Weekly Mow',          scheduledMins:30,  actualMins:28,  travelMins:12, scheduledRevenue:78,  actualRevenue:78  },
  { id:'J-1043', crew:'A', client:'Sandringham Townhouses',   suburb:'Sandringham',  service:'Edging + Mow',        scheduledMins:40,  actualMins:45,  travelMins:14, scheduledRevenue:110, actualRevenue:110 },
  { id:'J-1044', crew:'A', client:'14 Wattle St',             suburb:'Black Rock',   service:'Hedging',             scheduledMins:90,  actualMins:105, travelMins:22, scheduledRevenue:260, actualRevenue:240 },

  { id:'J-1051', crew:'B', client:'Riverview Estate',         suburb:'Bulleen',      service:'Fortnightly Mow',     scheduledMins:35,  actualMins:50,  travelMins:38, scheduledRevenue:95,  actualRevenue:95  },
  { id:'J-1052', crew:'B', client:'Ivanhoe Garden Co.',       suburb:'Ivanhoe',      service:'Garden Cleanup',      scheduledMins:120, actualMins:110, travelMins:20, scheduledRevenue:510, actualRevenue:540 },
  { id:'J-1053', crew:'B', client:'Eltham Reserve Body Corp', suburb:'Eltham',       service:'Green Waste Removal', scheduledMins:45,  actualMins:40,  travelMins:50, scheduledRevenue:150, actualRevenue:150 },
  { id:'J-1054', crew:'B', client:'Templestowe Park Strata',  suburb:'Templestowe',  service:'Weekly Mow',          scheduledMins:25,  actualMins:30,  travelMins:34, scheduledRevenue:70,  actualRevenue:70  },

  { id:'J-1061', crew:'C', client:'Toorak Estates',           suburb:'Toorak',       service:'Garden Cleanup',      scheduledMins:180, actualMins:175, travelMins:18, scheduledRevenue:860, actualRevenue:900 },
  { id:'J-1062', crew:'C', client:'Malvern Gardens',          suburb:'Malvern',      service:'Hedging',             scheduledMins:120, actualMins:115, travelMins:13, scheduledRevenue:430, actualRevenue:440 },
  { id:'J-1063', crew:'C', client:'Armadale Residences',      suburb:'Armadale',     service:'Garden Cleanup',      scheduledMins:150, actualMins:165, travelMins:16, scheduledRevenue:650, actualRevenue:680 },

  { id:'J-1071', crew:'D', client:'Hawthorn Strata',          suburb:'Hawthorn',     service:'Weekly Mow',          scheduledMins:35,  actualMins:33,  travelMins:14, scheduledRevenue:95,  actualRevenue:95  },
  { id:'J-1072', crew:'D', client:'Kew Heritage Home',        suburb:'Kew',          service:'Hedging + Edging',    scheduledMins:80,  actualMins:78,  travelMins:15, scheduledRevenue:330, actualRevenue:340 },
  { id:'J-1073', crew:'D', client:'Camberwell Court',         suburb:'Camberwell',   service:'Fortnightly Mow',     scheduledMins:30,  actualMins:29,  travelMins:13, scheduledRevenue:80,  actualRevenue:80  },
];

// 8-week trend (mock history so it reads as a trend, not a single day)
const TREND = [
  { wk:'W1', perMin:0.78, margin:22 },
  { wk:'W2', perMin:0.82, margin:24 },
  { wk:'W3', perMin:0.74, margin:21 },
  { wk:'W4', perMin:0.91, margin:26 },
  { wk:'W5', perMin:0.88, margin:25 },
  { wk:'W6', perMin:0.99, margin:28 },
  { wk:'W7', perMin:1.06, margin:30 },
  { wk:'W8', perMin:1.13, margin:31 },
];

// Profit by service type (this month, mock aggregate)
const SERVICE_PROFIT = [
  { service:'Garden Cleanup',      profit:8400, margin:38 },
  { service:'Hedging',             profit:5200, margin:31 },
  { service:'Fortnightly Mow',     profit:1800, margin:18 },
  { service:'Weekly Mow',          profit:2100, margin:16 },
  { service:'Edging',              profit:900,  margin:22 },
  { service:'Green Waste Removal', profit:1400, margin:12 },
];

// Client profitability (this month, mock aggregate)
const CLIENT_PROFIT = [
  { client:'Toorak Estates',      profit:3200 },
  { client:'Malvern Gardens',     profit:2400 },
  { client:'Armadale Residences', profit:1900 },
  { client:'Kew Heritage Home',   profit:1480 },
  { client:'Ivanhoe Garden Co.',  profit:1240 },
  { client:'Eltham Reserve',      profit:-90  },
  { client:'Templestowe Park',    profit:-210 },
  { client:'Riverview Estate',    profit:-640 },
];

// Automated alerts feed
const ALERTS = [
  { sev:'red',   icon:'!', title:'Riverview Estate now loss-making',   body:'3 visits running below cost. Travel + over-run wiping the margin.' },
  { sev:'amber', icon:'⟳', title:'14 Wattle St ran 40% over time',     body:'Hedging booked 90 min, took 105 min — and invoiced $20 under estimate.' },
  { sev:'amber', icon:'↗', title:'Crew B travel ratio above threshold', body:'58% travel-to-site today vs 22% target. Bulleen/Eltham run is too spread out.' },
  { sev:'blue',  icon:'$', title:'Toorak Estates billed $40 over est.', body:'Actual scope exceeded SortScape estimate — captured correctly in Xero.' },
];

const PEER_BENCHMARK = { perMin: 0.95, travelRatio: 22 }; // anonymised "operators like you"

/* ============================================================================
   DERIVE EVERYTHING from JOBS so the demo is always consistent
   ========================================================================== */

function wagePerMin(crewKey) {
  const c = CREWS[crewKey];
  return (c.payRate / 60) * c.crewSize;
}

function computeJob(j) {
  const rate = wagePerMin(j.crew);
  const onSiteWage = j.actualMins * rate;
  const travelWage = j.travelMins * rate;
  const vehicle = j.travelMins * COST_MODEL.vehiclePerMin;
  const overhead = j.actualRevenue * COST_MODEL.overheadRate;
  const cost = onSiteWage + travelWage + vehicle + overhead;
  const profit = j.actualRevenue - cost;
  return {
    ...j,
    rate,
    onSiteWage, travelWage, vehicle, overhead, cost, profit,
    wageCost: onSiteWage + travelWage,
    travelCost: travelWage + vehicle,
    profitPerMin: profit / j.actualMins,
    revPerMin: j.actualRevenue / j.actualMins,
    margin: profit / j.actualRevenue,
    revVariance: j.actualRevenue - j.scheduledRevenue,
    timeVariance: j.actualMins - j.scheduledMins,
  };
}

/* ============================================================================
   FORMAT HELPERS
   ========================================================================== */
const aud = (n, dp = 0) =>
  '$' + Number(n).toLocaleString('en-AU', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const pct = (n, dp = 0) => `${(n * 100).toFixed(dp)}%`;
const mins = (m) => {
  const h = Math.floor(m / 60), r = Math.round(m % 60);
  return h ? `${h}h ${r}m` : `${r}m`;
};
const marginColour = (m) => (m >= 0.28 ? 'text-emerald-400' : m >= 0.12 ? 'text-amber-400' : 'text-rose-400');
const marginBg = (m) => (m >= 0.28 ? 'bg-emerald-400' : m >= 0.12 ? 'bg-amber-400' : 'bg-rose-400');

/* ============================================================================
   SMALL UI PRIMITIVES
   ========================================================================== */
function Source({ children }) {
  const map = {
    SortScape: 'border-violet-400/30 text-violet-300 bg-violet-400/10',
    Xero:      'border-sky-400/30 text-sky-300 bg-sky-400/10',
    GPS:       'border-emerald-400/30 text-emerald-300 bg-emerald-400/10',
  };
  return (
    <span className={`inline-flex items-center rounded px-1.5 py-[1px] text-[10px] font-mono font-medium border ${map[children] || 'border-slate-500/30 text-slate-300 bg-slate-500/10'}`}>
      {children}
    </span>
  );
}

function Card({ className = '', children }) {
  return (
    <div className={`rounded-2xl border border-white/[0.06] bg-navy-800/80 card-shadow ${className}`}>
      {children}
    </div>
  );
}

function SectionTitle({ kicker, title, right }) {
  return (
    <div className="flex items-end justify-between mb-3">
      <div>
        {kicker && <div className="text-[11px] uppercase tracking-[0.18em] text-slate-500 font-semibold">{kicker}</div>}
        <h2 className="text-[15px] font-semibold text-slate-100">{title}</h2>
      </div>
      {right}
    </div>
  );
}

function Delta({ value, suffix = '%', goodUp = true }) {
  const up = value >= 0;
  const good = goodUp ? up : !up;
  return (
    <span className={`inline-flex items-center gap-0.5 text-[12px] font-mono font-medium ${good ? 'text-emerald-400' : 'text-rose-400'}`}>
      <span>{up ? '▲' : '▼'}</span>{Math.abs(value)}{suffix}
    </span>
  );
}

/* ============================================================================
   KPI STRIP
   ========================================================================== */
function KpiCard({ hero, label, value, unit, sub, delta, accent, sources }) {
  return (
    <Card className={`relative overflow-hidden p-4 fade-in ${hero ? 'ring-1 ring-cyan-400/25' : ''}`}>
      {hero && <div className="pointer-events-none absolute -top-16 -right-16 h-44 w-44 rounded-full bg-cyan-500/10 blur-3xl" />}
      <div className="flex items-start justify-between">
        <div className="text-[11px] uppercase tracking-[0.13em] text-slate-400 font-semibold leading-tight">{label}</div>
        {delta !== undefined && <Delta value={delta} />}
      </div>
      <div className="mt-2 flex items-baseline gap-1">
        <span className={`font-mono font-bold tracking-tight ${hero ? 'text-[40px] grad-text leading-none' : accent || 'text-slate-100'} ${hero ? '' : 'text-[26px]'}`}>
          {value}
        </span>
        {unit && <span className={`font-mono ${hero ? 'text-cyan-300/70 text-sm' : 'text-slate-500 text-xs'}`}>{unit}</span>}
      </div>
      {sub && <div className="mt-1 text-[12px] text-slate-400">{sub}</div>}
      {sources && <div className="mt-2.5 flex gap-1">{sources.map(s => <Source key={s}>{s}</Source>)}</div>}
    </Card>
  );
}

/* ============================================================================
   CHART TOOLTIP
   ========================================================================== */
function ChartTip({ active, payload, label, fmt }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div className="rounded-lg border border-white/10 bg-navy-950/95 px-3 py-2 text-xs shadow-xl">
      <div className="mb-1 font-mono text-slate-300">{label}</div>
      {payload.map((p, i) => (
        <div key={i} className="flex items-center gap-2 font-mono">
          <span className="h-2 w-2 rounded-full" style={{ background: p.color || p.fill }} />
          <span className="text-slate-400">{p.name}:</span>
          <span className="text-slate-100">{fmt ? fmt(p.value, p.name) : p.value}</span>
        </div>
      ))}
    </div>
  );
}

/* ============================================================================
   APP
   ========================================================================== */
function App() {
  const jobs = useMemo(() => JOBS.map(computeJob), []);

  // ----- aggregates -----
  const agg = useMemo(() => {
    const t = jobs.reduce((a, j) => {
      a.onSite += j.actualMins; a.travel += j.travelMins;
      a.rev += j.actualRevenue; a.est += j.scheduledRevenue;
      a.wage += j.wageCost; a.travelWage += j.travelWage; a.profit += j.profit;
      a.sched += j.scheduledMins;
      return a;
    }, { onSite:0, travel:0, rev:0, est:0, wage:0, travelWage:0, profit:0, sched:0 });
    const losers = jobs.filter(j => j.profit < 0);
    return {
      ...t,
      profitPerMin: t.profit / t.onSite,
      revPerMin: t.rev / t.onSite,
      travelRatio: t.travel / t.onSite,
      utilisation: t.onSite / (t.onSite + t.travel),
      revVariance: t.rev - t.est,
      losers,
    };
  }, [jobs]);

  // ----- crew scorecard -----
  const crews = useMemo(() => {
    return Object.keys(CREWS).map(k => {
      const cj = jobs.filter(j => j.crew === k);
      const s = cj.reduce((a, j) => {
        a.onSite += j.actualMins; a.travel += j.travelMins;
        a.rev += j.actualRevenue; a.wage += j.wageCost; a.profit += j.profit;
        return a;
      }, { onSite:0, travel:0, rev:0, wage:0, profit:0 });
      return {
        key:k, ...CREWS[k], jobs: cj.length, ...s,
        profitPerMin: s.profit / s.onSite,
        margin: s.profit / s.rev,
        travelRatio: s.travel / s.onSite,
      };
    }).sort((a, b) => b.profitPerMin - a.profitPerMin);
  }, [jobs]);

  // ----- worst job for re-pricing suggestion -----
  const worst = useMemo(() => jobs.slice().sort((a, b) => a.profit - b.profit)[0], [jobs]);
  const targetMargin = 0.25;
  const suggestedPrice = useMemo(() => {
    // price such that (price - nonRevCost) / price = targetMargin
    const nonRevCost = worst.onSiteWage + worst.travelWage + worst.vehicle;
    // overhead scales with revenue, so solve: price - nonRev - rate*price = m*price
    const r = COST_MODEL.overheadRate;
    return nonRevCost / (1 - targetMargin - r);
  }, [worst]);

  const bestJobId = useMemo(() => jobs.slice().sort((a,b)=>b.profitPerMin-a.profitPerMin)[0].id, [jobs]);

  // ----- job table filters -----
  const [crewFilter, setCrewFilter] = useState('all');
  const [svcFilter, setSvcFilter] = useState('all');
  const services = useMemo(() => ['all', ...Array.from(new Set(JOBS.map(j => j.service)))], []);
  const visibleJobs = useMemo(() => {
    return jobs
      .filter(j => crewFilter === 'all' || j.crew === crewFilter)
      .filter(j => svcFilter === 'all' || j.service === svcFilter)
      .sort((a, b) => b.profitPerMin - a.profitPerMin);
  }, [jobs, crewFilter, svcFilter]);

  const donut = [
    { name: 'On-site (billable)', value: agg.onSite, fill: '#38BDF8' },
    { name: 'Travel (unbillable)', value: agg.travel, fill: '#F59E0B' },
  ];
  const weeklyTravelRecover = Math.round(agg.travelWage * 0.35 * 5); // tighten routing ~35%, 5 days

  return (
    <div className="min-h-screen bg-navy-900">
      {/* ============ TOP BAR ============ */}
      <header className="sticky top-0 z-30 border-b border-white/[0.06] bg-navy-900/85 backdrop-blur supports-[backdrop-filter]:bg-navy-900/70">
        <div className="mx-auto flex max-w-[1440px] items-center justify-between px-5 py-3">
          <div className="flex items-center gap-3">
            <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 font-bold text-navy-950 shadow-lg shadow-cyan-500/20">G</div>
            <div className="leading-tight">
              <div className="flex items-center gap-2">
                <span className="text-[13px] font-semibold text-slate-100">Greenline Grounds Maintenance</span>
                <span className="rounded bg-white/[0.05] px-1.5 py-[1px] text-[9px] font-semibold uppercase tracking-wider text-slate-400 border border-white/10">Demo</span>
              </div>
              <div className="text-[11px] text-slate-500">Job Profitability — operations command centre</div>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <div className="hidden md:flex items-center gap-2 text-[11px] text-slate-400">
              <span className="text-slate-500">Operational data:</span>
              <span className="font-mono text-emerald-400">live</span>
              <span className="text-slate-700">·</span>
              <span className="text-slate-500">Costs:</span>
              <span className="font-mono text-slate-300">refreshed 6:00am</span>
            </div>
            <div className="flex items-center gap-2 rounded-full border border-emerald-400/25 bg-emerald-400/10 px-3 py-1">
              <span className="relative inline-flex h-2 w-2">
                <span className="pulse-dot absolute inline-flex h-2 w-2 rounded-full"></span>
                <span className="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"></span>
              </span>
              <span className="text-[11px] font-semibold tracking-wide text-emerald-300">Live</span>
            </div>
          </div>
        </div>
      </header>

      <main className="mx-auto max-w-[1440px] space-y-7 px-5 py-6">

        {/* ============ KPI STRIP ============ */}
        <section>
          <div className="mb-3 flex items-center justify-between">
            <div>
              <div className="text-[11px] uppercase tracking-[0.18em] text-slate-500 font-semibold">Today · all crews</div>
              <h1 className="text-lg font-semibold text-slate-100">True profitability, live — net of wages &amp; travel</h1>
            </div>
            <div className="hidden lg:block text-right text-[11px] text-slate-500">
              {jobs.length} jobs completed · {mins(agg.onSite)} on site · {mins(agg.travel)} driving
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6">
            <KpiCard hero label="Profit / min on site" value={aud(agg.profitPerMin, 2)} unit="/min" delta={6.4}
              sub="The hero metric — every billable minute, net" sources={['Xero','GPS']} />
            <KpiCard label="Revenue / min on site" value={aud(agg.revPerMin, 2)} unit="/min" delta={2.1}
              accent="grad-text" sub="Top-line per billable minute" sources={['Xero','GPS']} />
            <KpiCard label="Travel : on-site ratio" value={pct(agg.travelRatio)} accent="text-amber-400"
              sub={`Yours ${pct(agg.travelRatio)} · target 22%`} sources={['GPS']} />
            <KpiCard label="Today's profit" value={aud(agg.profit)} delta={8.9} accent="text-emerald-400"
              sub="Across all crews, after all costs" sources={['Xero','GPS']} />
            <KpiCard label="Billable utilisation" value={pct(agg.utilisation)} accent="text-cyan-300"
              sub="On-site ÷ total paid time" sources={['GPS']} />
            <KpiCard label="Loss-making jobs" value={agg.losers.length} accent="text-rose-400"
              sub={agg.losers.map(j => j.suburb).join(' · ')} sources={['Xero','GPS']} />
          </div>
        </section>

        {/* ============ CREW SCORECARD ============ */}
        <section>
          <SectionTitle kicker="Which team makes money" title="Crew scorecard"
            right={<span className="text-[11px] text-slate-500">Ranked by profit / min on site</span>} />
          <Card className="overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-[13px]">
                <thead>
                  <tr className="text-[11px] uppercase tracking-wider text-slate-500 border-b border-white/[0.06]">
                    <th className="px-4 py-3 font-semibold">Crew</th>
                    <th className="px-4 py-3 font-semibold text-right">Jobs</th>
                    <th className="px-4 py-3 font-semibold text-right">On-site</th>
                    <th className="px-4 py-3 font-semibold text-right">Travel</th>
                    <th className="px-4 py-3 font-semibold text-right">Revenue</th>
                    <th className="px-4 py-3 font-semibold text-right">Wage cost</th>
                    <th className="px-4 py-3 font-semibold text-right">$ / min</th>
                    <th className="px-4 py-3 font-semibold text-right">Margin</th>
                  </tr>
                </thead>
                <tbody className="font-mono">
                  {crews.map((c, i) => (
                    <tr key={c.key} className="row-hover border-b border-white/[0.04] last:border-0 hover:bg-white/[0.025]">
                      <td className="px-4 py-3">
                        <div className="flex items-center gap-2.5 font-sans">
                          <span className="h-7 w-1 rounded" style={{ background: c.colour }} />
                          <div>
                            <div className="font-semibold text-slate-100">{c.name}
                              {i === 0 && <span className="ml-2 rounded bg-emerald-400/15 px-1.5 py-[1px] text-[9px] font-semibold uppercase text-emerald-300 border border-emerald-400/20">Top</span>}
                              {i === crews.length - 1 && <span className="ml-2 rounded bg-rose-400/15 px-1.5 py-[1px] text-[9px] font-semibold uppercase text-rose-300 border border-rose-400/20">Watch</span>}
                            </div>
                            <div className="text-[11px] text-slate-500">Lead {c.lead} · {c.crewSize} crew · {aud(c.payRate)}/hr</div>
                          </div>
                        </div>
                      </td>
                      <td className="px-4 py-3 text-right text-slate-300">{c.jobs}</td>
                      <td className="px-4 py-3 text-right text-slate-300">{mins(c.onSite)}</td>
                      <td className="px-4 py-3 text-right text-amber-300/90">{mins(c.travel)}<span className="ml-1 text-[10px] text-slate-600">{pct(c.travelRatio)}</span></td>
                      <td className="px-4 py-3 text-right text-slate-200">{aud(c.rev)}</td>
                      <td className="px-4 py-3 text-right text-slate-400">{aud(c.wage)}</td>
                      <td className={`px-4 py-3 text-right font-semibold ${marginColour(c.margin)}`}>{aud(c.profitPerMin, 2)}</td>
                      <td className="px-4 py-3 text-right">
                        <div className="flex items-center justify-end gap-2">
                          <div className="hidden sm:block h-1.5 w-16 overflow-hidden rounded-full bg-white/[0.06]">
                            <div className={`h-full ${marginBg(c.margin)}`} style={{ width: `${Math.max(4, Math.min(100, c.margin * 200))}%` }} />
                          </div>
                          <span className={`font-semibold ${marginColour(c.margin)}`}>{pct(c.margin)}</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </section>

        {/* ============ JOB-LEVEL TABLE ============ */}
        <section>
          <SectionTitle kicker="Job-by-job" title="Today's job profitability"
            right={
              <div className="flex items-center gap-2">
                <select value={crewFilter} onChange={e => setCrewFilter(e.target.value)}
                  className="rounded-lg border border-white/10 bg-navy-750 px-2.5 py-1.5 text-[12px] text-slate-300 outline-none focus:border-cyan-400/40">
                  <option value="all">All crews</option>
                  {Object.keys(CREWS).map(k => <option key={k} value={k}>{CREWS[k].name}</option>)}
                </select>
                <select value={svcFilter} onChange={e => setSvcFilter(e.target.value)}
                  className="rounded-lg border border-white/10 bg-navy-750 px-2.5 py-1.5 text-[12px] text-slate-300 outline-none focus:border-cyan-400/40">
                  {services.map(s => <option key={s} value={s}>{s === 'all' ? 'All services' : s}</option>)}
                </select>
              </div>
            } />
          <Card className="overflow-hidden">
            <div className="max-h-[420px] overflow-auto">
              <table className="w-full text-left text-[12.5px]">
                <thead className="sticky top-0 z-10 bg-navy-800/95 backdrop-blur">
                  <tr className="text-[10.5px] uppercase tracking-wider text-slate-500 border-b border-white/[0.06]">
                    <th className="px-4 py-2.5 font-semibold">Client / suburb</th>
                    <th className="px-3 py-2.5 font-semibold">Service</th>
                    <th className="px-3 py-2.5 font-semibold text-right">Sched→Actual <Source>GPS</Source></th>
                    <th className="px-3 py-2.5 font-semibold text-right">Travel</th>
                    <th className="px-3 py-2.5 font-semibold text-right">Est <Source>SortScape</Source></th>
                    <th className="px-3 py-2.5 font-semibold text-right">Actual <Source>Xero</Source></th>
                    <th className="px-3 py-2.5 font-semibold text-right">Wage</th>
                    <th className="px-3 py-2.5 font-semibold text-right">Profit</th>
                    <th className="px-3 py-2.5 font-semibold text-right">$ / min</th>
                  </tr>
                </thead>
                <tbody className="font-mono">
                  {visibleJobs.map(j => {
                    const loss = j.profit < 0;
                    const best = j.id === bestJobId;
                    return (
                      <tr key={j.id} className={`row-hover border-b border-white/[0.035] last:border-0 hover:bg-white/[0.03] ${loss ? 'bg-rose-500/[0.06]' : ''}`}>
                        <td className="px-4 py-2.5">
                          <div className="flex items-center gap-1.5 font-sans">
                            {best && <span className="text-amber-400" title="Most profitable">★</span>}
                            <span className="font-medium text-slate-100">{j.client}</span>
                          </div>
                          <div className="font-sans text-[11px] text-slate-500">{j.suburb} · {CREWS[j.crew].name}</div>
                        </td>
                        <td className="px-3 py-2.5 font-sans text-slate-300">{j.service}</td>
                        <td className="px-3 py-2.5 text-right text-slate-300">
                          {j.scheduledMins}<span className="text-slate-600">→</span>{j.actualMins}m
                          {j.timeVariance > 0 && <span className="ml-1 text-amber-400">+{j.timeVariance}</span>}
                          {j.timeVariance < 0 && <span className="ml-1 text-emerald-400">{j.timeVariance}</span>}
                        </td>
                        <td className="px-3 py-2.5 text-right text-amber-300/80">{j.travelMins}m</td>
                        <td className="px-3 py-2.5 text-right text-slate-400">{aud(j.scheduledRevenue)}</td>
                        <td className="px-3 py-2.5 text-right text-slate-200">
                          {aud(j.actualRevenue)}
                          {j.revVariance !== 0 && <span className={`ml-1 text-[10px] ${j.revVariance > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{j.revVariance > 0 ? '+' : ''}{j.revVariance}</span>}
                        </td>
                        <td className="px-3 py-2.5 text-right text-slate-400">{aud(j.wageCost)}</td>
                        <td className={`px-3 py-2.5 text-right font-semibold ${loss ? 'text-rose-400' : 'text-emerald-400'}`}>{loss ? '−' : ''}{aud(Math.abs(j.profit))}</td>
                        <td className={`px-3 py-2.5 text-right font-semibold ${marginColour(j.margin)}`}>{aud(j.profitPerMin, 2)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div className="flex flex-wrap items-center gap-x-5 gap-y-1 border-t border-white/[0.06] px-4 py-2.5 text-[11px] text-slate-500">
              <span><span className="text-amber-400">★</span> most profitable</span>
              <span><span className="inline-block h-2 w-3 rounded-sm bg-rose-500/40 align-middle"></span> loss-making</span>
              <span className="ml-auto font-mono text-slate-400">{visibleJobs.length} jobs shown · profit {aud(visibleJobs.reduce((a,j)=>a+j.profit,0))}</span>
            </div>
          </Card>
        </section>

        {/* ============ CHARTS ROW ============ */}
        <section className="grid grid-cols-1 gap-4 lg:grid-cols-3">
          {/* $/min trend */}
          <Card className="p-4">
            <SectionTitle kicker="Last 8 weeks" title="$ / min on site — trend" />
            <ResponsiveContainer width="100%" height={210}>
              <AreaChart data={TREND} margin={{ top: 6, right: 6, left: -18, bottom: 0 }}>
                <defs>
                  <linearGradient id="gPm" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#22D3EE" stopOpacity={0.5} />
                    <stop offset="100%" stopColor="#3B82F6" stopOpacity={0} />
                  </linearGradient>
                </defs>
                <CartesianGrid stroke="rgba(255,255,255,0.05)" vertical={false} />
                <XAxis dataKey="wk" stroke="#64748b" fontSize={11} tickLine={false} axisLine={false} />
                <YAxis stroke="#64748b" fontSize={11} tickLine={false} axisLine={false} domain={[0.6, 1.25]} tickFormatter={v => '$' + v.toFixed(2)} />
                <Tooltip content={<ChartTip fmt={(v,n)=> n==='margin' ? v+'%' : '$'+Number(v).toFixed(2)+'/min'} />} />
                <Area type="monotone" dataKey="perMin" name="profit/min" stroke="#22D3EE" strokeWidth={2.5} fill="url(#gPm)" dot={{ r: 2.5, fill: '#22D3EE' }} activeDot={{ r: 4 }} />
              </AreaChart>
            </ResponsiveContainer>
            <div className="mt-1 text-[11px] text-slate-500">Up from <span className="font-mono text-slate-400">$0.78</span> to <span className="font-mono text-cyan-300">${TREND[TREND.length-1].perMin.toFixed(2)}</span> — routing &amp; pricing changes compounding.</div>
          </Card>

          {/* profit by service */}
          <Card className="p-4">
            <SectionTitle kicker="This month" title="Profit by service type" />
            <ResponsiveContainer width="100%" height={210}>
              <BarChart data={SERVICE_PROFIT} layout="vertical" margin={{ top: 0, right: 12, left: 8, bottom: 0 }}>
                <CartesianGrid stroke="rgba(255,255,255,0.05)" horizontal={false} />
                <XAxis type="number" stroke="#64748b" fontSize={11} tickLine={false} axisLine={false} tickFormatter={v => '$' + (v/1000) + 'k'} />
                <YAxis type="category" dataKey="service" stroke="#94a3b8" fontSize={10.5} width={104} tickLine={false} axisLine={false} />
                <Tooltip cursor={{ fill: 'rgba(255,255,255,0.03)' }} content={<ChartTip fmt={(v)=>aud(v)} />} />
                <Bar dataKey="profit" name="profit" radius={[0,4,4,0]} barSize={15}>
                  {SERVICE_PROFIT.map((s,i)=>(
                    <Cell key={i} fill={s.margin >= 28 ? '#34D399' : s.margin >= 16 ? '#38BDF8' : '#F59E0B'} />
                  ))}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
            <div className="mt-1 text-[11px] text-slate-500">Cleanups &amp; hedging carry the business — weekly mows are thin once travel is loaded in.</div>
          </Card>

          {/* client profitability */}
          <Card className="p-4">
            <SectionTitle kicker="This month" title="Most &amp; least profitable clients" />
            <ResponsiveContainer width="100%" height={210}>
              <BarChart data={CLIENT_PROFIT} layout="vertical" margin={{ top: 0, right: 14, left: 8, bottom: 0 }}>
                <CartesianGrid stroke="rgba(255,255,255,0.05)" horizontal={false} />
                <XAxis type="number" stroke="#64748b" fontSize={11} tickLine={false} axisLine={false} tickFormatter={v => '$' + (v/1000).toFixed(1) + 'k'} />
                <YAxis type="category" dataKey="client" stroke="#94a3b8" fontSize={10} width={108} tickLine={false} axisLine={false} />
                <Tooltip cursor={{ fill: 'rgba(255,255,255,0.03)' }} content={<ChartTip fmt={(v)=>aud(v)} />} />
                <ReferenceLine x={0} stroke="rgba(255,255,255,0.2)" />
                <Bar dataKey="profit" name="profit" radius={[0,3,3,0]} barSize={13}>
                  {CLIENT_PROFIT.map((c,i)=>(<Cell key={i} fill={c.profit >= 0 ? '#38BDF8' : '#F87171'} />))}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
            <div className="mt-1 text-[11px] text-slate-500">Three clients are <span className="text-rose-400">below cost</span> this month — Riverview leads the leak at {aud(-640)}.</div>
          </Card>
        </section>

        {/* ============ MARGIN LEAK + RIGHT RAIL ============ */}
        <section className="grid grid-cols-1 gap-4 lg:grid-cols-3">
          {/* margin leak / travel analysis */}
          <Card className="p-5 lg:col-span-1">
            <SectionTitle kicker="The hidden cost" title="Margin leak — travel" />
            <div className="flex items-center gap-4">
              <ResponsiveContainer width="45%" height={150}>
                <PieChart>
                  <Pie data={donut} dataKey="value" innerRadius={42} outerRadius={64} paddingAngle={2} stroke="none">
                    {donut.map((d,i)=>(<Cell key={i} fill={d.fill} />))}
                  </Pie>
                  <Tooltip content={<ChartTip fmt={(v)=>mins(v)} />} />
                </PieChart>
              </ResponsiveContainer>
              <div className="flex-1 space-y-2">
                <div>
                  <div className="flex items-center gap-2 text-[12px]"><span className="h-2.5 w-2.5 rounded-sm bg-sky-400"></span><span className="text-slate-300">On-site</span></div>
                  <div className="font-mono text-lg text-slate-100">{mins(agg.onSite)} <span className="text-xs text-slate-500">{pct(agg.utilisation)}</span></div>
                </div>
                <div>
                  <div className="flex items-center gap-2 text-[12px]"><span className="h-2.5 w-2.5 rounded-sm bg-amber-500"></span><span className="text-slate-300">Travel</span></div>
                  <div className="font-mono text-lg text-amber-300">{mins(agg.travel)} <span className="text-xs text-slate-500">{pct(1 - agg.utilisation)}</span></div>
                </div>
              </div>
            </div>
            <div className="mt-4 rounded-xl border border-amber-400/20 bg-amber-400/[0.06] p-3.5">
              <div className="text-[13px] leading-relaxed text-amber-100/90">
                Crews spent <span className="font-mono font-semibold text-amber-300">{mins(agg.travel)}</span> driving today — about <span className="font-mono font-semibold text-amber-300">{aud(agg.travelWage)}</span> in unbillable labour.
                Tightening run routing could recover <span className="font-mono font-semibold text-emerald-300">~{aud(weeklyTravelRecover)}/week</span>.
              </div>
            </div>
          </Card>

          {/* alerts feed */}
          <Card className="p-5 lg:col-span-1">
            <SectionTitle kicker="Automated" title="Alerts feed"
              right={<span className="rounded-full bg-cyan-400/10 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-cyan-300 border border-cyan-400/20">Auto</span>} />
            <div className="space-y-2.5">
              {ALERTS.map((a, i) => {
                const c = { red:'border-rose-400/25 bg-rose-400/[0.06]', amber:'border-amber-400/25 bg-amber-400/[0.06]', blue:'border-sky-400/25 bg-sky-400/[0.06]' }[a.sev];
                const ic = { red:'bg-rose-400/15 text-rose-300', amber:'bg-amber-400/15 text-amber-300', blue:'bg-sky-400/15 text-sky-300' }[a.sev];
                return (
                  <div key={i} className={`flex gap-3 rounded-xl border p-3 ${c}`}>
                    <div className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-lg font-mono text-sm ${ic}`}>{a.icon}</div>
                    <div>
                      <div className="text-[12.5px] font-semibold text-slate-100">{a.title}</div>
                      <div className="text-[11.5px] leading-snug text-slate-400">{a.body}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>

          {/* benchmarking + repricing */}
          <div className="space-y-4 lg:col-span-1">
            {/* benchmarking teaser */}
            <Card className="p-5">
              <SectionTitle kicker="Cross-client" title="Benchmark vs operators like you"
                right={<span className="rounded-full bg-violet-400/10 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-violet-300 border border-violet-400/20">Example</span>} />
              <div className="grid grid-cols-2 gap-3">
                <div className="rounded-xl border border-white/[0.06] bg-navy-750/60 p-3">
                  <div className="text-[11px] text-slate-500">Profit / min</div>
                  <div className="font-mono text-xl text-emerald-400">{aud(agg.profitPerMin,2)}</div>
                  <div className="text-[11px] text-slate-500">peer avg <span className="font-mono text-slate-400">{aud(PEER_BENCHMARK.perMin,2)}</span></div>
                  <div className="mt-1 text-[10px] font-semibold text-emerald-400">+{pct(agg.profitPerMin/PEER_BENCHMARK.perMin - 1)} ahead</div>
                </div>
                <div className="rounded-xl border border-white/[0.06] bg-navy-750/60 p-3">
                  <div className="text-[11px] text-slate-500">Travel ratio</div>
                  <div className="font-mono text-xl text-amber-400">{pct(agg.travelRatio)}</div>
                  <div className="text-[11px] text-slate-500">peer avg <span className="font-mono text-slate-400">{PEER_BENCHMARK.travelRatio}%</span></div>
                  <div className="mt-1 text-[10px] font-semibold text-amber-400">{pct(agg.travelRatio - PEER_BENCHMARK.travelRatio/100)} above peers</div>
                </div>
              </div>
              <div className="mt-3 text-[11px] text-slate-500">Anonymised benchmark across comparable grounds-maintenance operators — an example of the cross-client insight we can layer in.</div>
            </Card>

            {/* repricing suggestion */}
            <Card className="p-5">
              <SectionTitle kicker="Data → decision" title="Re-pricing suggestion" />
              <div className="rounded-xl border border-rose-400/20 bg-rose-400/[0.06] p-3.5">
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-[13px] font-semibold text-slate-100">{worst.client}</div>
                    <div className="text-[11px] text-slate-400">{worst.suburb} · {worst.service}</div>
                  </div>
                  <div className="text-right">
                    <div className="font-mono text-sm text-rose-400">{aud(worst.profit)}</div>
                    <div className="text-[10px] text-slate-500">{pct(worst.margin)} margin</div>
                  </div>
                </div>
                <div className="mt-3 flex items-center gap-2 rounded-lg border border-emerald-400/20 bg-emerald-400/[0.07] px-3 py-2">
                  <span className="text-[11px] text-slate-300">Suggested price to hit 25% margin:</span>
                  <span className="font-mono text-sm font-semibold text-emerald-300">{aud(suggestedPrice)}</span>
                  <span className="font-mono text-[11px] text-emerald-400">(+{aud(suggestedPrice - worst.actualRevenue)})</span>
                </div>
                <div className="mt-2 text-[11px] text-slate-500">Currently invoiced {aud(worst.actualRevenue)} — the run is too far out for the ticket size. Re-price or re-route.</div>
              </div>
            </Card>
          </div>
        </section>

        {/* footer */}
        <footer className="flex flex-wrap items-center justify-between gap-2 border-t border-white/[0.06] pt-4 pb-2 text-[11px] text-slate-600">
          <div className="flex items-center gap-3">
            <span>Data sources:</span><Source>SortScape</Source><Source>Xero</Source><Source>GPS</Source>
          </div>
          <div className="font-mono">Demo dashboard · all figures illustrative · Local Service Pro</div>
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
